sources:
  jobicy:
    enabled: true
    kind: api
    base_url: "https://jobicy.com/api/v2/remote-jobs"
    max_jobs: 25
    min_interval_minutes: 60
    attribution_required: true
    note: "Public API; preserve Jobicy URL and attribution."

  remotive:
    enabled: true
    kind: api
    base_url: "https://remotive.com/api/remote-jobs"
    max_jobs: 25
    min_interval_minutes: 60
    attribution_required: true
    note: "Public API; preserve Remotive URL and source attribution."

  arbeitnow:
    enabled: true
    kind: api
    base_url: "https://www.arbeitnow.com/api/job-board-api"
    max_jobs: 25
    min_interval_minutes: 60
    attribution_required: true
    note: "Public no-key API."

  keejob:
    enabled: true
    kind: html
    max_jobs: 25
    min_interval_minutes: 60
    obey_robots_txt: true
    pages:
      - "https://www.keejob.com/offres-emploi/metiers/recrutement-informatique-multimedia/"
      - "https://www.keejob.com/offres-emploi/metiers/recrutement-ingenieur-industrie-production/"
      - "https://www.keejob.com/offres-emploi/metiers/recrutement-electronique-electricite-energie/"
    note: "Small public-page collector; robots.txt checked before requests."